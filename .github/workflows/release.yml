name: Release native apps

on:
  repository_dispatch:
    types: [source-release]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.client_payload.source_sha }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Verify source tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Whales-Group/digitwhale_tide_web
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Verify all release versions
        run: npm run release:verify --silent >/dev/null 2>&1 || { echo 'Release version verification failed.'; exit 1; }
      - name: Verify dispatched source tag
        id: tag
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$RELEASE_TAG" = "app-v${version}" || { echo "Release tag does not match app version."; exit 1; }
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA" || { echo "Release tag does not match source commit."; exit 1; }
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Ensure release draft exists before builds
        env:
          GH_TOKEN: ${{ secrets.AURDALY_RELEASES_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="app-v${version}"
          release_repo="https://github.com/Whales-Group/aurdaly-releases.git"
          if ! git ls-remote --exit-code --heads "$release_repo" refs/heads/production >/dev/null 2>&1; then
            seed_dir=$(mktemp -d)
            git -C "$seed_dir" init --initial-branch=production
            git -C "$seed_dir" config user.name "github-actions[bot]"
            git -C "$seed_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cat > "$seed_dir/README.md" <<'EOF'
          # Aurdaly Releases

          Official Aurdaly desktop and Android releases.
          EOF
            git -C "$seed_dir" add README.md
            git -C "$seed_dir" commit -m "Initialize Aurdaly releases repository"
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -C "$seed_dir" -c http.extraheader="$auth_header" push "$release_repo" HEAD:production
          fi
          if ! gh release view "$tag" --repo Whales-Group/aurdaly-releases >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo Whales-Group/aurdaly-releases \
              --target production \
              --draft \
              --title "Aurdaly v${version}" \
              --notes "Builds are in progress. Any successful platform installers will be attached before publication."
          fi

  desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Apple Silicon only — smallest, fastest, no cross-compile.
          - runner: macos-15
            name: macOS Apple Silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json
          # Native Intel only. macos-13 was retired; macos-15-intel is the
          # current GA label for the x86_64 standard (non-large) runner.
          - runner: macos-15-intel
            name: macOS Intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json
          # Universal (both slices via lipo) — built on the arm runner,
          # cross-compiling the x86_64 slice; host arch doesn't matter here.
          - runner: macos-15
            name: macOS Universal
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json
          - runner: windows-latest
            name: Windows
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - runner: ubuntu-24.04
            name: Linux
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
    name: Desktop / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Whales-Group/digitwhale_tide_web
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build libraries
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify release version
        run: npm run release:verify --silent >/dev/null 2>&1 || { echo 'Release version verification failed.'; exit 1; }
      - name: Increase Node.js heap for Linux release build
        if: startsWith(matrix.runner, 'ubuntu')
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.AURDALY_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Whales-Group
          repo: aurdaly-releases
          releaseCommitish: production
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseName: Aurdaly v__VERSION__
          releaseBody: Download the installer for your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: prepare-release
    name: Android / APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Whales-Group/digitwhale_tide_web
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Verify release version
        run: npm run release:verify --silent >/dev/null 2>&1 || { echo 'Release version verification failed.'; exit 1; }
      - name: Restore Android Firebase configuration
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_JSON_BASE64"
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode --ignore-garbage > src-tauri/gen/android/app/google-services.json
      - name: Build Android APK
        env:
          AURDALY_ANDROID_KEYSTORE_BASE64: ${{ secrets.AURDALY_ANDROID_KEYSTORE_BASE64 }}
          AURDALY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AURDALY_ANDROID_KEYSTORE_PASSWORD }}
          AURDALY_ANDROID_KEY_ALIAS: ${{ secrets.AURDALY_ANDROID_KEY_ALIAS }}
          AURDALY_ANDROID_KEY_PASSWORD: ${{ secrets.AURDALY_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$AURDALY_ANDROID_KEYSTORE_BASE64"
          test -n "$AURDALY_ANDROID_KEYSTORE_PASSWORD"
          test -n "$AURDALY_ANDROID_KEY_ALIAS"
          test -n "$AURDALY_ANDROID_KEY_PASSWORD"
          printf '%s' "$AURDALY_ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/aurdaly-release.jks"
          test -s "$RUNNER_TEMP/aurdaly-release.jks"
          export AURDALY_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/aurdaly-release.jks"
          echo "AURDALY_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/aurdaly-release.jks" >> "$GITHUB_ENV"
          sdkmanager 'ndk;27.2.12479018'
          npm run tauri:android:apk -- --ci
          SIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -s "$SIGNED_APK" || { echo "Signed release APK was not produced; refusing to publish an unsigned APK."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER" || { echo "Android apksigner was not found; refusing to publish an unverified APK."; exit 1; }
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
      - uses: softprops/action-gh-release@v2
        with:
          repository: Whales-Group/aurdaly-releases
          token: ${{ secrets.AURDALY_RELEASES_TOKEN }}
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          target_commitish: production
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

  publish:
    needs: [prepare-release, desktop, android]
    name: Publish available builds
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Whales-Group/digitwhale_tide_web
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ github.event.client_payload.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Publish release and preserve updater feed
        env:
          GH_TOKEN: ${{ secrets.AURDALY_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          repo=Whales-Group/aurdaly-releases
          version="${RELEASE_TAG#app-v}"
          changes=$(node scripts/generate-release-notes.mjs "$RELEASE_TAG")
          notes=$(cat <<EOF
          ${changes}
          EOF
          )
          has_updater_manifest=$(gh release view "$RELEASE_TAG" --repo "$repo" --json assets --jq '.assets | map(.name) | index("latest.json") != null')
          if [ "$has_updater_manifest" = "true" ]; then
            gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false --latest --title "Aurdaly v${version}" --notes "$notes"
          else
            gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false --latest=false --title "Aurdaly v${version}" --notes "$notes"
          fi
